plugins {
    id 'java'
    id 'application'
}

group = 'emu.leman.ggserver'
version = '1.0.0'
description = 'emu.leman.ggserver — native Java Guitar Girl emulator'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    implementation 'org.mongodb:mongodb-driver-sync:5.3.1'
    implementation 'ch.qos.logback:logback-classic:1.5.23'
    testImplementation platform('org.junit:junit-bom:5.12.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'de.bwaldvogel:mongo-java-server:1.47.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'emu.leman.ggserver.Main' }
sourceSets {
    main {
        resources {
            srcDir 'src/main/java'
            include '**/*.html'
            include '**/*.xml'
        }
    }
}
distributions {
    main {
        contents {
            from('.') {
                include 'resources/server-config.example.json'
                include 'resources/schema/**', 'resources/gamedata/**', 'resources/cdn_files/**', 'resources/static/**'
                include 'resources/event_config.json', 'resources/broadcast_posts.json', 'resources/post_seq.json'
                include 'resources/README.md'
                include 'README.md', 'SECURITY.md', 'MONGO_COLLECTIONS.md'
            }
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
test { useJUnitPlatform() }
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'emu.leman.ggserver',
                'Implementation-Version': project.version,
                'Automatic-Module-Name': 'emu.leman.ggserver'
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
