services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GG_ADMIN_PASSWORD: ${GG_ADMIN_PASSWORD:?Set GG_ADMIN_PASSWORD before starting Compose}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - server-resources:/app/resources
      - ./resources/docker/server-config.json:/app/resources/server-config.json:ro
      - server-data:/app/resources/data
      - server-captures:/app/resources/captures
volumes:
  server-resources:
  mongo-data:
  server-data:
  server-captures:
